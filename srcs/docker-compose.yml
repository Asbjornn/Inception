services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    volumes:
     - mariadb:/var/lib/mysql
    networks:
     - inception
    env_file: .env
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    depends_on:
     - mariadb
    volumes:
     - wordpress:/var/www/html
    networks:
     - inception
    env_file: .env
    secrets:
      - db_password
      - credentials

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    depends_on:
     - wordpress
    ports:
     - "443:443"
    volumes:
     - wordpress:/var/www/html
    networks:
     - inception
    env_file: .env

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gcauchy/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gcauchy/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt